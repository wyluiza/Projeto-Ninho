
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geladeira do Ninho</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

    
    <style>

        .formulario-alimento {
    display: none;
    margin-top: 18px;
    padding: 20px;
    background: #fff;
    border: 2px solid #dceef8;
    border-radius: 18px;
}

.formulario-alimento.aberto {
    display: block;
}

.formulario-alimento h2 {
    margin-bottom: 16px;
    font-size: 17px;
}

.formulario-alimento label {
    display: block;
    margin: 12px 0 7px;
    font-size: 12px;
    font-weight: 700;
}

.formulario-alimento input,
.formulario-alimento select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d7eaf5;
    border-radius: 10px;
    background: #fbfdff;
    color: #36566b;
    font-family: inherit;
}

.linha-formulario {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.acoes-alimento {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
}

.acoes-alimento button {
    padding: 5px 9px;
    border: none;
    border-radius: 8px;
    background: #e2f4ff;
    color: #36566b;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
}

.acoes-alimento .remover {
    background: #fff0f0;
    color: #b46b78;
}

.botao-salvar {
    width: 100%;
    margin-top: 16px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: #a5dcfa;
    color: #24465b;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
}

.mensagem-estoque {
    margin-top: 12px;
    font-size: 11px;
    text-align: center;
    line-height: 1.7;
}

@media (max-width: 420px) {
    .linha-formulario {
        grid-template-columns: 1fr;
    }
}
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 30px 16px;
            background: #eaf7ff;
            font-family: 'Comfortaa', sans-serif;
            color: #36566b;
        }

        .pagina {
            max-width: 850px;
            margin: auto;
        }

        .voltar {
            display: inline-block;
            margin-bottom: 22px;
            color: #527b96;
            text-decoration: none;
            font-size: 12px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 28px;
        }

        .titulo h1 {
            font-size: clamp(24px, 5vw, 34px);
            margin-bottom: 10px;
        }

        .titulo p {
            font-size: 12px;
            line-height: 1.8;
            color: #7895a8;
        }

        /* A geladeira */
        .geladeira {
            max-width: 520px;
            margin: auto;
            padding: 13px;
            background: #c7dce8;
            border-radius: 28px 28px 20px 20px;
            box-shadow: 0 12px 25px #8bb7d333;
            border: 2px solid #b3cfdf;
        }

        .porta {
            background: #fbfdff;
            border: 2px solid #e0edf4;
            border-radius: 20px 20px 13px 13px;
            padding: 18px;
        }

        .topo-geladeira {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 3px 4px 16px;
        }

        .marca {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #8ab8d3;
        }

        .luz {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #a8dfbd;
            box-shadow: 0 0 8px #a8dfbd;
        }

        .prateleira {
            position: relative;
            margin-bottom: 13px;
            padding: 14px 10px 18px;
            background: #eff9ff;
            border: 1px solid #dceef8;
            border-radius: 12px;
            border-bottom: 6px solid #d2e6f1;
        }

        .nome-prateleira {
            margin-bottom: 13px;
            color: #81a5bc;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .alimentos {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .alimento {
            min-width: 0;
            padding: 10px 3px;
            text-align: center;
            background: white;
            border: 1px solid #e2eef5;
            border-radius: 12px;
        }

        .emoji {
            display: block;
            margin-bottom: 7px;
            font-size: 27px;
        }

        .alimento h3 {
            margin-bottom: 6px;
            font-size: 10px;
            overflow-wrap: anywhere;
        }

        .quantidade {
            display: inline-block;
            padding: 5px 6px;
            border-radius: 8px;
            background: #e2f4ff;
            color: #5484a2;
            font-size: 9px;
            font-weight: 700;
        }

        .gaveta {
            padding: 15px;
            text-align: center;
            background: #e5f3fb;
            border: 2px solid #d1e6f2;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        .puxador {
            width: 9px;
            height: 65px;
            position: absolute;
            right: 7px;
            top: 40%;
            border-radius: 10px;
            background: #c3dce9;
        }

        .botao-adicionar {
            display: block;
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: #a5dcfa;
            color: #24465b;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .botao-adicionar:hover {
            background: #8dcef3;
        }

        .observacao {
            margin-top: 14px;
            text-align: center;
            color: #7895a8;
            font-size: 10px;
            line-height: 1.8;
        }

        @media (max-width: 420px) {
            .porta {
                padding: 12px;
            }

            .alimentos {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .puxador {
                display: none;
            }
        }
                .quantidade.acabando {
                    background: #fff2cf;
                    color: #a87924;
                }

                .quantidade.esgotado {
                    background: #ffe8ed;
                    color: #bd7184;
                }

                .status-alimento {
                    margin-top: 6px;
                    font-size: 9px;
                    line-height: 1.5;
                    font-weight: 700;
                }
    </style>
</head>

<body>
    <main class="pagina">
        <a class="voltar" href="inicio.html">← Voltar para o Ninho</a>

        <header class="titulo">
            <h1>🧊 Nossa geladeira</h1>
            <p>Tudo fresquinho e organizado para cuidar da nossa família.</p>
        </header>

        <section class="geladeira">
            <div class="porta">
                <div class="topo-geladeira">
                    <span class="marca">NINHO HOME</span>
                    <span class="luz"></span>
                </div>

                <div class="prateleira">
                    <p class="nome-prateleira">Alimentos da Geladeira</p>
                    <div class="alimentos"></div>
                    </div>

                <div class="gaveta">SUA GELADEIRA TEM:</div>
                <div class="puxador"></div>
            </div>
        </section>

        <button class="botao-adicionar" type="button"
    onclick="abrirFormulario()">
    + Adicionar alimento
</button>

<section class="formulario-alimento" id="formularioAlimento">
    <h2>🧺 O que chegou na geladeira?</h2>

    <form id="formAlimento">
        <label for="nomeAlimento">Nome do alimento</label>
        <input id="nomeAlimento" type="text"
            placeholder="Ex.: Queijo colonial" required maxlength="60">

        <div class="linha-formulario">
            <div>
                <label for="quantidadeAlimento">Quantidade</label>
                <input id="quantidadeAlimento" type="number"
                    min="0.01" step="any" placeholder="Ex.: 2" required>
            </div>

            <div>
                <label for="unidadeAlimento">Unidade</label>
                <select id="unidadeAlimento">
                    <option value="un.">Unidades</option>
                    <option value="kg">Quilos (kg)</option>
                    <option value="g">Gramas (g)</option>
                    <option value="L">Litros (L)</option>
                    <option value="ml">Mililitros (ml)</option>
                    <option value="cx.">Caixas</option>
                    <option value="pct.">Pacotes</option>
                    <option value="pote(s)">Potes</option>
                    <option value="lata(s)">Latas</option>
                    <option value="cacho(s)">Cachos</option>
                </select>
            </div>
        </div>

            <label for="emojiAlimento">Desenho do alimento</label>
            <select id="emojiAlimento">
                <option value="🥛">🥛 Leite</option>
                <option value="🧀">🧀 Queijo</option>
                <option value="🥚">🥚 Ovos</option>
                <option value="🥕">🥕 Legumes</option>
                <option value="🍎">🍎 Frutas</option>
                <option value="🍞">🍞 Pães</option>
                <option value="🥩">🥩 Carnes</option>
                <option value="🧃">🧃 Bebidas</option>
                <option value="🍚">🍚 Grãos</option>
                <option value="🍪">🍪 Doces</option>
                <option value="🧊">🧊 Outros</option>
            </select>

        <button class="botao-salvar" type="submit">
            Guardar na geladeira ♡
        </button>

        <p class="mensagem-estoque" id="mensagemEstoque"></p>
    </form>
</section>

<p class="observacao">
    Cada ingrediente ajuda a preparar momentos especiais. ♡<br>
    Sua família pode adicionar os alimentos que quiser!
</p>
    </main>
   
<script>
const chaveGeladeira = "ninhoGeladeira";
let alimentos = [];

function salvar() {
    localStorage.setItem(chaveGeladeira, JSON.stringify(alimentos));
}

function abrirFormulario() {
    const formulario = document.getElementById("formularioAlimento");
    formulario.classList.toggle("aberto");

    if (formulario.classList.contains("aberto")) {
        document.getElementById("nomeAlimento").focus();
    }
}

function normalizarNome(nome) {
    return nome
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/\s+/g, " ");
}

function distanciaEdicao(a, b) {
    const matriz = Array.from(
        { length: a.length + 1 },
        () => Array(b.length + 1).fill(0)
    );

    for (let i = 0; i <= a.length; i++) matriz[i][0] = i;
    for (let j = 0; j <= b.length; j++) matriz[0][j] = j;

    for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
            const custo = a[i - 1] === b[j - 1] ? 0 : 1;
            matriz[i][j] = Math.min(
                matriz[i - 1][j] + 1,
                matriz[i][j - 1] + 1,
                matriz[i - 1][j - 1] + custo
            );
        }
    }

    return matriz[a.length][b.length];
}

function nomesParecidos(nome1, nome2) {
    const a = normalizarNome(nome1);
    const b = normalizarNome(nome2);

    if (a === b) return true;
    if (Math.min(a.length, b.length) < 4) return false;

    return distanciaEdicao(a, b) <= 2;
}

function carregarAlimentos() {
    const salvos = localStorage.getItem(chaveGeladeira);

    if (salvos) {
        try {
            const dados = JSON.parse(salvos);
            alimentos = Array.isArray(dados) ? dados : [];
        } catch {
            alimentos = [];
        }
    } else {
        alimentos = [];
    }

    // Garante que os dados antigos tenham os campos necessários.
    alimentos = alimentos.map((item, indice) => ({
        id: item.id || `alimento-${indice}-${Date.now()}`,
        nome: item.nome || "Alimento",
        emoji: item.emoji || "🍎",
        quantidade: Number(item.quantidade) || 0,
        unidade: item.unidade || "un."
    }));

    salvar();
    renderizar();
}

function renderizar() {
    const lista = document.querySelector(".prateleira .alimentos");
    const gaveta = document.querySelector(".gaveta");

    if (!lista || !gaveta) return;

    lista.innerHTML = "";

    if (alimentos.length === 0) {
        gaveta.textContent = "🧊 SUA GELADEIRA ESTÁ VAZIA";
        return;
    }

    gaveta.textContent = `🥬 ${alimentos.length} alimentos na geladeira`;

    alimentos.forEach(alimento => {
        const cartao = document.createElement("article");
        cartao.className = "alimento";

        const emoji = document.createElement("span");
        emoji.className = "emoji";
        emoji.textContent = alimento.emoji;

        const nome = document.createElement("h3");
        nome.textContent = alimento.nome;

        const quantidade = document.createElement("span");
        quantidade.className = "quantidade";
        quantidade.textContent = `${alimento.quantidade} ${alimento.unidade}`;

        const status = document.createElement("p");
        status.className = "status-alimento";

        if (alimento.quantidade <= 0) {
            quantidade.classList.add("esgotado");
            status.textContent = "Acabou! ♡";
        } else if (alimento.quantidade <= 2) {
            quantidade.classList.add("acabando");
            status.textContent = "Está acabando!";
        } else {
            status.textContent = "Tem disponível";
        }

        const acoes = document.createElement("div");
        acoes.className = "acoes-alimento";

        const menos = document.createElement("button");
        menos.type = "button";
        menos.textContent = "−";
        menos.onclick = () => alterarQuantidade(alimento.id, -1);

        const mais = document.createElement("button");
        mais.type = "button";
        mais.textContent = "+";
        mais.onclick = () => alterarQuantidade(alimento.id, 1);

        const remover = document.createElement("button");
        remover.type = "button";
        remover.className = "remover";
        remover.textContent = "×";
        remover.onclick = () => removerAlimento(alimento.id);

        acoes.append(menos, mais, remover);
        cartao.append(emoji, nome, quantidade, status, acoes);
        lista.append(cartao);
    });
}

function alterarQuantidade(id, variacao) {
    const alimento = alimentos.find(item => item.id === id);
    if (!alimento) return;

    const novaQuantidade = alimento.quantidade + variacao;
    if (novaQuantidade < 0) return;

    alimento.quantidade = Math.round(novaQuantidade * 100) / 100;
    salvar();
    renderizar();
}

function removerAlimento(id) {
    const alimento = alimentos.find(item => item.id === id);
    if (!alimento) return;

    if (!confirm(`Remover ${alimento.nome} da geladeira?`)) return;

    alimentos = alimentos.filter(item => item.id !== id);
    salvar();
    renderizar();
}

document.getElementById("formAlimento").addEventListener("submit", event => {
    event.preventDefault();

    const nome = document.getElementById("nomeAlimento").value.trim();
    const quantidade = Number(
        document.getElementById("quantidadeAlimento").value
    );
    const unidade = document.getElementById("unidadeAlimento").value;
    const emoji = document.getElementById("emojiAlimento").value;

    const mensagem = document.getElementById("mensagemEstoque");

    if (!nome || !Number.isFinite(quantidade) || quantidade <= 0) {
        mensagem.textContent = "Confira o nome e a quantidade. 💙";
        return;
    }

    const existente = alimentos.find(item =>
        nomesParecidos(item.nome, nome) && item.unidade === unidade
    );

    if (existente) {
        existente.quantidade = Math.round(
            (existente.quantidade + quantidade) * 100
        ) / 100;
    } else {
        alimentos.push({
            id: Date.now().toString() + Math.random().toString(16).slice(2),
            nome,
            emoji,
            quantidade,
            unidade
        });
    }

    salvar();
    renderizar();

    event.target.reset();
    mensagem.textContent = "Oba! Alimento guardado na geladeira. ♡";
});

carregarAlimentos();
</script>
</body>
</html>
