
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formar um Ninho</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="cadastro-container">

        <a href="index.html" class="botao-voltar">← Voltar</a>

        <header class="cabecalho">
            <h1>Construa seu Ninho</h1>
            <p>Um espaço para organizar sua casa e cuidar de quem você ama.</p>
        </header>

        <form id="formularioNinho">

            <div class="campo">
                <label for="nomeNinho">Nome do Ninho</label>
                <input type="text" id="nomeNinho" name="nomeNinho"
                    placeholder="Ex.: Ninho da família" required>
            </div>

            <div class="campo">
                <label for="nome">Seu nome</label>
                <input type="text" id="nome" name="nome"
                    placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                    placeholder="voce@exemplo.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                    placeholder="Crie uma senha" minlength="6" required>
            </div>

            <div class="campo campo-funcao">
                <label for="papel">Qual será sua função no Ninho?</label>

                <select id="papel" name="papel" required>
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option value="RESPONSAVEL">Responsável do Ninho</option>
                    <option value="MEMBRO">Membro do Ninho</option>
                </select>

                <small class="ajuda">
                    O responsável administra o Ninho. Os membros participam da organização da casa.
                </small>
            </div>

            <button type="submit" class="botao-principal">
                Formar meu Ninho
            </button>

            <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

        </form>

        <footer>
            Seu lar, mais organizado. Seu Ninho, mais unido.
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
