
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formar um Ninho</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cadastro.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="pagina-cadastro">

    <a href="index.html" class="botao-voltar">← Voltar</a>

    <main class="cadastro-layout">

        <section class="cadastro-apresentacao">
            <div class="marca-ninho">
                <div class="simbolo-ninho">⌂</div>
                <h1>Ninho</h1>
            </div>

            <p class="frase-ninho">
                Organização hoje,<br>
                mais momentos juntos amanhã.
            </p>

            <div class="ilustracao-ninho" aria-hidden="true">
                <div class="nuvem nuvem-1"></div>
                <div class="nuvem nuvem-2"></div>
                <div class="casinha">
                    <span>♥</span>
                </div>
                <div class="base-ninho"></div>
                <span class="coracao coracao-1">♥</span>
                <span class="coracao coracao-2">♥</span>
            </div>

            <p class="mensagem-apresentacao">
                Um lar mais organizado começa<br>
                com pequenas coisas feitas juntos.
            </p>
        </section>

        <section class="cadastro-formulario">

            <header class="cabecalho-cadastro">
                <span class="etiqueta-cadastro">SEU ESPAÇO EM FAMÍLIA</span>
                <h2>Construa seu Ninho</h2>
                <p>Um espaço para organizar sua casa e cuidar de quem você ama.</p>
            </header>

            <form id="formularioNinho">

                <div class="campo" id="campoNomeNinho">
                    <label for="nomeNinho">Nome do Ninho</label>
                    <input type="text" id="nomeNinho" name="nomeNinho" 
                    placeholder="Ex.: Ninho da Familia" required>
                </div>


                <div class="campo">
                    <label for="nome">Seu nome</label>
                    <input type="text" id="nome" name="nome"
                        placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email"
                        placeholder="voce@exemplo.com" required>
                </div>
                    
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="campo-senha">
                            <input type="password" id="senha"
                                placeholder="Crie uma senha" required>
                            <button type="button" id="mostrarSenha"
                                    class="botao-olho" aria-label="Mostrar senha">👁</button>
                        </div>
                    </div>

                
                    <input type="hidden" id="papel" name="papel" value="RESPONSAVEL">

                <button type="submit" class="botao-principal">
                    ♥ &nbsp; Formar meu Ninho
                </button>

                <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

            </form>

            <footer class="rodape-cadastro">
                Seu lar, mais organizado. Seu Ninho, mais unido.
            </footer>

        </section>

    </main>

    <script src="script.js">
        
            document.getElementById("mostrarSenha").addEventListener("click", function() {
                const campo = document.getElementById("senha");

                if (campo.type === "password") {
                    campo.type = "text";
                    this.textContent = "👁";
                    this.setAttribute("aria-label", "Esconder senha");
                } else {
                    campo.type = "password";
                    this.textContent = "👁";
                    this.setAttribute("aria-label", "Mostrar senha");
                }
            });

                </script>
                <script>
            document.getElementById("mostrarSenha").addEventListener("click", function() {
                const campo = document.getElementById("senha");

                campo.type = campo.type === "password" ? "text" : "password";
            });
            </script>
</body>
</html>
