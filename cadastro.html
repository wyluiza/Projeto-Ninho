
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formar um Ninho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Vamos formar seu Ninho!</h1>
        <p>Comece criando um espaço para sua família.</p>
        </form>
            <label for="nomeNinho">Qual vai ser o nome do seu Ninho?</label>
            <input type="text" id="nomeNinho" placeholder="Ex.: Ninho da família" required>

            <label for="nomeResponsavel">Qual é o seu nome?</label>
            <input type="text" id="nomeResponsavel" placeholder="Como podemos te chamar?" required>

            <label for="email">Seu e-mail:</label>
            <input type="email" id="email" placeholder="voce@exemplo.com" required>

            <label for="cargo">Qual é o seu cargo na família?</label>
            <input type="text" id="cargo" placeholder="Ex.: Mãe, Pai, Tio..." required>

            <button type="submit">Criar meu Ninho</button>

        </form>
    </main>
</body>
</html>
