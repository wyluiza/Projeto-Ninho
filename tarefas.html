
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas | Ninho</title>

    <link rel="stylesheet" href="tarefas.css">
</head>
<body>

    <main class="pagina-tarefas">
        <header class="cabecalho-tarefas">
            <h1>Tarefas do Ninho</h1>
            <p>Pequenas tarefas, grandes conquistas!</p>
        </header>

        <section class="resumo-estrelas">
            <h2>Minhas estrelas</h2>
            <p id="total-estrelas">⭐ 0 estrelas</p>
        </section>

        <section class="lista-tarefas">
            <h2>Minhas tarefas</h2>
            <div id="tarefas-container">
                <p>Nenhuma tarefa cadastrada ainda.</p>
            </div>
        </section>

        <section class="cadastro-tarefa" id="cadastro-tarefa">
            <h2>Cadastrar tarefa</h2>

            <form id="form-tarefa">
                <label for="nome-tarefa">Nome da tarefa</label>
                <input type="text" id="nome-tarefa" required>

                <label for="responsavel-tarefa">Responsável</label>
                <input type="text" id="responsavel-tarefa" required>

                <label for="prazo-tarefa">Prazo</label>
                <input type="datetime-local" id="prazo-tarefa" required>

                <button type="submit">Adicionar tarefa</button>
            </form>
        </section>
    </main>

    <script src="tarefas.js"></script>
</body>
</html>
